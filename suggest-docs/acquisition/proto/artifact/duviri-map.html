<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duviri Farm Map</title>
<style>
:root {
  --bg-deep: #060a12; --bg-base: #0a0e17; --bg-surface: #111827; --bg-raised: #1a2234; --bg-hover: #1f2b3f;
  --accent: #d4a843; --accent-glow: rgba(212,168,67,.15);
  --text-primary: #e8e4dc; --text-secondary: #8b93a5; --text-muted: #8d9ab3;
  --border: rgba(212,168,67,.1); --border-strong: rgba(212,168,67,.25); --border-subtle: rgba(255,255,255,.12);
  --radius-sm: .28rem; --radius-md: .42rem;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg-base); color: var(--text-primary);
  font: 14px/1.35 "Barlow", system-ui, sans-serif; overflow: hidden; }
.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
.label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; line-height: 1.2; }
.sub { font-weight: 400; text-transform: none; letter-spacing: .02em; color: var(--text-secondary); margin-left: 9px; }
header { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: var(--bg-surface);
  border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header .label { color: var(--accent); }
.plans { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--bg-raised); color: var(--text-secondary); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 4px 10px; font: inherit; font-size: .8125rem; cursor: pointer; }
.chip:hover { background: var(--bg-hover); color: var(--text-primary); }
.chip.on { background: var(--accent-glow); border-color: var(--border-strong); color: var(--accent); }
.chip small { color: var(--text-muted); margin-left: 5px; }
main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
.map { position: relative; overflow: hidden; background: var(--bg-deep); cursor: grab; user-select: none; touch-action: none; }
.map.drag { cursor: grabbing; }
.map img { position: absolute; left: 0; top: 0; width: 4000px; height: 4000px; transform-origin: 0 0;
  max-width: none; pointer-events: none; image-rendering: auto; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pin { cursor: pointer; }
.pin:hover .shape { stroke: #fff; stroke-width: 2.5; }
.tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
.tools button { background: rgba(17,24,39,.92); color: var(--text-primary); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); font: inherit; font-size: .8125rem; padding: 4px 10px; cursor: pointer; min-width: 30px; }
.tools button:hover { background: var(--bg-hover); }
.tip { position: absolute; pointer-events: none; background: var(--bg-deep); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); padding: 6px 9px; font-size: .8125rem; max-width: 280px; display: none; z-index: 5; }
.tip b { display: block; font-weight: 600; }
.tip .n { color: var(--text-secondary); }
.tip .r { color: var(--text-muted); font-size: .75rem; margin-top: 2px; }
aside { background: var(--bg-surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.side-head button { background: none; border: 1px solid var(--border); color: var(--text-secondary); border-radius: var(--radius-sm);
  font: inherit; font-size: .75rem; padding: 2px 9px; cursor: pointer; }
.side-head button:hover { color: var(--text-primary); background: var(--bg-hover); }
.rows { overflow-y: auto; padding: 6px 0; }
.row { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: start; padding: 8px 14px;
  border-bottom: 1px solid rgba(255,255,255,.04); }
.row.off .name, .row.off .qty { color: var(--text-muted); }
.row.off .sw { opacity: .3; }
.sw { width: 12px; height: 12px; border-radius: 50%; margin-top: 3px; border: 1px solid rgba(0,0,0,.6); }
.top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.name { background: none; border: 0; padding: 0; color: var(--text-primary); font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
.name:hover { color: var(--accent); }
.qty { color: var(--accent); font-variant-numeric: tabular-nums; font-size: .8125rem; }
.meta { grid-column: 2 / 4; font-size: .75rem; color: var(--text-muted); }
.meta .k { color: var(--text-secondary); }
.where { grid-column: 2 / 4; font-size: .75rem; color: var(--text-secondary); }
.nopins { font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; color: #f8a171; border: 1px solid rgba(248,161,113,.3);
  border-radius: var(--radius-sm); padding: 0 5px; }
.tog { position: relative; width: 30px; height: 16px; border-radius: 8px; background: var(--bg-raised); border: 1px solid var(--border-subtle);
  cursor: pointer; padding: 0; margin-top: 2px; }
.tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); transition: left .12s; }
.tog.on { background: var(--accent-glow); border-color: var(--border-strong); }
.tog.on::after { left: 16px; background: var(--accent); }
.tog:disabled { opacity: .35; cursor: default; }
footer { padding: 5px 14px; font-size: .6875rem; color: var(--text-muted); background: var(--bg-surface); border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; }
@media (max-width: 760px) {
  html, body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  header { padding: 10px 16px; }
  .plans { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
  .chip { white-space: nowrap; }
  main { grid-template-columns: 1fr; }
  .map { height: 62vh; }
  aside { border-left: 0; border-top: 1px solid var(--border); }
  .rows { overflow: visible; }
  .row, .side-head { padding-left: 16px; padding-right: 16px; }
  footer { flex-direction: column; gap: 2px; padding: 6px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="label">Duviri map<span class="sub">plans that need Duviri harvestables</span></div>
    <div class="plans" id="plans"></div>
  </header>
  <main>
    <div class="map" id="map">
      <img id="img" src="duviri.webp" alt="Duviri map" draggable="false">
      <svg id="pins"></svg>
      <div class="tools">
        <button id="fit" title="Fit map to view">Fit</button>
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">&minus;</button>
      </div>
      <div class="tip" id="tip"></div>
    </div>
    <aside>
      <div class="side-head">
        <div class="label" id="sideTitle">Resources</div>
        <button id="all">All</button>
      </div>
      <div class="rows" id="rows"></div>
    </aside>
  </main>
  <footer><span>Map and marker data: wiki.warframe.com (CC BY-NC-SA)</span><span id="status"></span></footer>
</div>

const RES = {"Aggristone":{"best":{"place":"DUVIRI","sub":"Open landscape","activity":"Destroy Aggristone Formations","meta":null}},"Ariette Scale":{"best":{"place":"DUVIRI","sub":"Maw Feeding fishing spot","activity":"Maw Feeding","meta":null}},"Connla Sprout":{"best":{"place":"DUVIRI","sub":"Lunaro Court","activity":"Harvest Connla plant nodes near water and caves","meta":"densest spot"}},"Dracroot":{"best":{"place":"DUVIRI","sub":"Cliffs on the central island: Lonesome Outlook, Fair Shores Hamlet, Watershed Hamlet, Hermit Landing, Moirai Crossing","activity":"Cut Dracroot plants","meta":null}},"Eevani":{"best":{"place":"DUVIRI","sub":"Archarbor","activity":"Harvest Eevani plants; Joy, Sorrow or Envy moods","meta":"much higher quantity than the Amphitheater"}},"Kovnik":{"best":{"place":"DUVIRI","sub":"Lunaro Court","activity":"Harvest Kovnik plant nodes near water","meta":"all moods"}},"Maw Fang":{"best":{"place":"DUVIRI","sub":"Maw Feeding platforms next to ponds","activity":"Feed the Maw in The Duviri Experience","meta":"one spot is reusable, no need to move between ponds"}},"Nacreous Pebble":{"best":{"place":"DUVIRI","sub":"Maw Feeding","activity":"fish any Maw Feeding spot","meta":null}},"Saggen Pearl":{"best":{"place":"DUVIRI","sub":"Blinkpads","activity":"Collect from Blinkpads; most regions in all moods","meta":null}},"Silphsela":{"best":{"place":"DUVIRI","sub":"Sun Silph plants on hillsides, thickest in the snowy region near Titan's Rest","activity":"Gather the seeds floating around each plant","meta":"4 floating seeds per plant, 3 more burst within 8 m"}},"Tasoma Extract":{"best":{"place":"DUVIRI","sub":"Caves","activity":"Harvest Tasoma nodes inside caves","meta":"2-4 per node"}},"Ueymag":{"best":{"place":"DUVIRI","sub":"Kullervo's Hold","activity":"Harvest the U-shaped cactus","meta":"Anger, Fear or Sorrow spirals"}},"Yao Shrub":{"best":{"place":"DUVIRI","sub":"Snowy areas: Titan's Rest, Soprano Springs, Netherbarrow, Netherbarrow Crossing, Custos Arch, Throneguard Barracks","activity":"Break shrubs above ground, any Cycle","meta":"3-5 per plant"}}};
const COLORS = {"Aggristone":"#78716c","Ariette Scale":"#3b82f6","Connla Sprout":"#4ade80","Dracroot":"#ef4444","Eevani":"#a78bfa","Kovnik":"#2dd4bf","Maw Fang":"#94a3b8","Nacreous Pebble":"#fb923c","Saggen Pearl":"#e8e4dc","Silphsela":"#a3e635","Tasoma Extract":"#f472b6","Ueymag":"#facc15","Yao Shrub":"#7dd3fc"};
</script>
<script>
const SIZE = 4000;
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const mapEl = $('map'), img = $('img'), svg = $('pins'), tip = $('tip');
const view = { s: 0.2, x: 0, y: 0 };
const state = { plan: null, on: new Set() };
const KIND_WORD = { resource: 'harvest', fishing: 'fishing', cave: 'cave' };

const pinsFor = (name) => PINS.filter((p) => p.refs.includes(name));

function whereText(name) {
  const best = RES[name]?.best;
  if (!best) return '';
  const parts = [best.place !== 'DUVIRI' ? best.place : null, best.sub, best.activity, best.meta].filter(Boolean);
  return parts.join(' · ');
}

function pinSummary(name) {
  const counts = {};
  for (const p of pinsFor(name)) counts[p.kind] = (counts[p.kind] ?? 0) + 1;
  const words = { resource: ['spot', 'spots'], fishing: ['fishing spot', 'fishing spots'], cave: ['cave entrance', 'cave entrances'] };
  return Object.entries(counts).map(([k, n]) => `${n} ${words[k][n === 1 ? 0 : 1]}`).join(' + ');
}

function kindOf(name) {
  const kinds = [...new Set(pinsFor(name).map((p) => p.kind))];
  if (kinds.includes('fishing')) return 'fishing';
  return kinds.includes('resource') || kinds.length === 0 ? 'harvest' : KIND_WORD[kinds[0]];
}

function renderPlans() {
  const box = $('plans');
  box.innerHTML = '';
  for (const plan of PLANS) {
    const b = document.createElement('button');
    b.className = 'chip' + (plan.id === state.plan.id ? ' on' : '');
    b.innerHTML = `${plan.name}<small>${plan.resources.length}</small>`;
    b.title = plan.id;
    b.onclick = () => selectPlan(plan.id);
    box.append(b);
  }
}

function selectPlan(id) {
  state.plan = PLANS.find((p) => p.id === id);
  state.on = new Set(state.plan.resources.map((r) => r.name).filter((n) => pinsFor(n).length > 0));
  renderPlans();
  renderRows();
  renderPins();
}

function renderRows() {
  const rows = $('rows');
  rows.innerHTML = '';
  $('sideTitle').innerHTML = `Resources<span class="sub">${state.plan.name}</span>`;
  for (const r of state.plan.resources) {
    const count = pinsFor(r.name).length;
    const on = state.on.has(r.name);
    const row = document.createElement('div');
    row.className = 'row' + (on ? '' : ' off');
    row.innerHTML = `
      <span class="sw" style="background:${COLORS[r.name]}"></span>
      <div class="top"><button class="name" title="Show only ${r.name}">${r.name}</button>
        <span class="qty">×${r.qty.toLocaleString('en-US')}</span>
        ${count === 0 ? '<span class="nopins">no pins</span>' : ''}</div>
      <button class="tog${on ? ' on' : ''}" aria-pressed="${on}" title="Show or hide pins" ${count === 0 ? 'disabled' : ''}></button>
      <div class="meta"><span class="k">${kindOf(r.name)}</span> · ${count === 0 ? 'no wiki markers' : pinSummary(r.name)}</div>
      <div class="where">${whereText(r.name)}</div>`;
    row.querySelector('.name').onclick = () => {
      state.on = count > 0 ? new Set([r.name]) : new Set();
      renderRows(); renderPins();
    };
    row.querySelector('.tog').onclick = () => {
      if (state.on.has(r.name)) state.on.delete(r.name); else state.on.add(r.name);
      renderRows(); renderPins();
    };
    rows.append(row);
  }
}

$('all').onclick = () => {
  state.on = new Set(state.plan.resources.map((r) => r.name).filter((n) => pinsFor(n).length > 0));
  renderRows(); renderPins();
};

let drawn = [];

function wedge(r, a0, a1) {
  const p = (a) => `${(r * Math.sin(a)).toFixed(2)},${(-r * Math.cos(a)).toFixed(2)}`;
  return `M0,0 L${p(a0)} A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${p(a1)} Z`;
}

function pinNode(pin, colors) {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'pin');
  const r = pin.kind === 'cave' ? 6 : 7;
  let shape;
  if (pin.kind === 'cave') {
    shape = document.createElementNS(NS, 'rect');
    Object.entries({ x: -r, y: -r, width: 2 * r, height: 2 * r, rx: 1.5, transform: 'rotate(45)' }).forEach(([k, v]) => shape.setAttribute(k, v));
    shape.setAttribute('fill', colors[0]);
  } else {
    shape = document.createElementNS(NS, 'circle');
    shape.setAttribute('r', r);
    shape.setAttribute('fill', colors[0]);
  }
  shape.setAttribute('class', 'shape');
  shape.setAttribute('stroke', pin.kind === 'fishing' ? '#e8e4dc' : '#060a12');
  shape.setAttribute('stroke-width', pin.kind === 'fishing' ? 2 : 1.5);
  g.append(shape);
  if (colors.length > 1 && pin.kind !== 'cave') {
    const step = (2 * Math.PI) / colors.length;
    colors.forEach((c, i) => {
      if (i === 0) return;
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', wedge(r - 1, i * step, (i + 1) * step));
      path.setAttribute('fill', c);
      path.setAttribute('pointer-events', 'none');
      g.append(path);
    });
  }
  g.addEventListener('mouseenter', () => showTip(pin));
  g.addEventListener('mousemove', moveTip);
  g.addEventListener('mouseleave', () => (tip.style.display = 'none'));
  g.addEventListener('pointerdown', (e) => { e.stopPropagation(); showTip(pin); moveTip(e); });
  return g;
}

function renderPins() {
  svg.innerHTML = '';
  drawn = [];
  const needed = state.plan.resources.map((r) => r.name);
  const order = (kind) => ({ cave: 0, resource: 1, fishing: 2 })[kind];
  const visible = PINS
    .map((pin) => ({ pin, refs: pin.refs.filter((n) => needed.includes(n) && state.on.has(n)) }))
    .filter((v) => v.refs.length > 0)
    .sort((a, b) => order(a.pin.kind) - order(b.pin.kind));
  for (const { pin, refs } of visible) {
    const node = pinNode(pin, refs.map((n) => COLORS[n]));
    svg.append(node);
    drawn.push({ pin, node });
  }
  $('status').textContent = `${visible.length} pins shown`;
  place();
}

function showTip(pin) {
  const needed = state.plan.resources.map((r) => r.name);
  const refs = pin.refs.filter((n) => needed.includes(n));
  tip.innerHTML = `<b>${pin.label}</b>${pin.note ? `<div class="n">${pin.note}</div>` : ''}` +
    `<div class="r">${KIND_WORD[pin.kind]} · ${refs.join(', ')}</div>`;
  tip.style.display = 'block';
}

function moveTip(e) {
  const box = mapEl.getBoundingClientRect();
  let x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
  if (x + tip.offsetWidth > box.width - 6) x = e.clientX - box.left - tip.offsetWidth - 14;
  if (y + tip.offsetHeight > box.height - 6) y = e.clientY - box.top - tip.offsetHeight - 14;
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}

function place() {
  img.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  for (const { pin, node } of drawn) {
    const sx = view.x + pin.position[0] * view.s;
    const sy = view.y + (SIZE - pin.position[1]) * view.s;
    node.setAttribute('transform', `translate(${sx.toFixed(1)},${sy.toFixed(1)})`);
  }
}

function fit() {
  const w = mapEl.clientWidth, h = mapEl.clientHeight;
  view.s = Math.min(w, h) / SIZE;
  view.x = (w - SIZE * view.s) / 2;
  view.y = (h - SIZE * view.s) / 2;
  place();
}

function zoomAt(factor, cx, cy) {
  const s = Math.min(2, Math.max(0.05, view.s * factor));
  const k = s / view.s;
  view.x = cx - (cx - view.x) * k;
  view.y = cy - (cy - view.y) * k;
  view.s = s;
  place();
}

mapEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const box = mapEl.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - box.left, e.clientY - box.top);
}, { passive: false });

let drag = null;
mapEl.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.tools')) return;
  tip.style.display = 'none';
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  mapEl.classList.add('drag');
  mapEl.setPointerCapture(e.pointerId);
});
mapEl.addEventListener('pointermove', (e) => {
  if (!drag) return;
  view.x = drag.vx + e.clientX - drag.x;
  view.y = drag.vy + e.clientY - drag.y;
  place();
});
const endDrag = () => { drag = null; mapEl.classList.remove('drag'); };
mapEl.addEventListener('pointerup', endDrag);
mapEl.addEventListener('pointercancel', endDrag);

$('fit').onclick = fit;
$('zin').onclick = () => zoomAt(1.4, mapEl.clientWidth / 2, mapEl.clientHeight / 2);
$('zout').onclick = () => zoomAt(1 / 1.4, mapEl.clientWidth / 2, mapEl.clientHeight / 2);
window.addEventListener('resize', fit);

selectPlan(PLANS.some((p) => p.id === 'plan-kullervo') ? 'plan-kullervo' : PLANS[0].id);
fit();

</script>
</body>
</html>
