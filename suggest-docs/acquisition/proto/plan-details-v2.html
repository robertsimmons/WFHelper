<title>Plan Details v2</title>
<style>
:root {
  --bg-body: #0b0d14;
  --bg-surface: #12151f;
  --bg-card: #1a1e2b;
  --bg-card-hover: #222738;
  --bg-input: #262b3b;
  --bg-hero: #0d0d1a;
  --border-default: #2c3244;
  --border-subtle: #20253a;
  --text-primary: #e0e0e0;
  --text-heading: #f0f0f0;
  --text-muted: #9e9eb8;
  --text-faint: #606078;
  --accent: #e0b23c;
  --accent-blue: #5b9cf6;
  --accent-green: #4caf50;
  --accent-red: #ef5350;
  --accent-orange: #ffb74d;
  --badge-green-bg: #1b3a1b;
  --badge-orange-bg: #3a2a10;
  --badge-blue-bg: #152a3a;
  --shadow-card: 0 2px 8px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg-body); color: var(--text-primary);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.bar .label { color: var(--text-muted); margin-right: 4px; min-width: 52px; }
.tab {
  background: var(--bg-card); border: 1px solid var(--border-default); color: var(--text-primary);
  border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer;
}
.tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.head { display: flex; gap: 16px; align-items: center; margin: 18px 0; }
.art {
  width: 88px; height: 56px; border-radius: 6px; background: var(--bg-card);
  border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center;
  color: var(--text-faint); font-size: 0.8em; text-align: center; line-height: 1.2;
}
.head h1 { margin: 0; font-size: 1.5em; color: var(--text-heading); display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.eff { font-size: 0.55em; font-weight: 600; background: var(--badge-blue-bg); color: var(--accent-blue); }
.links a { color: var(--accent-blue); margin-right: 12px; text-decoration: none; font-size: 0.88em; }
.links { margin-left: 4px; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.done { color: var(--text-faint); text-decoration: line-through; }
.chip {
  display: inline-block; padding: 0 8px; border-radius: 4px; background: var(--bg-input);
  color: var(--text-muted); font-size: 0.88em; margin: 2px 4px 2px 0; white-space: nowrap;
}
.chip.warn { background: var(--badge-orange-bg); color: var(--accent-orange); }
.chip.ok { background: var(--badge-green-bg); color: var(--accent-green); }
.chip.gate { background: transparent; border: 1px dashed var(--border-default); color: var(--text-muted); }
.qty { font-variant-numeric: tabular-nums; color: var(--text-heading); }
.drawer {
  margin: 6px 0 4px 34px; padding: 10px 14px; background: var(--bg-surface);
  border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 0.92em;
}
.drawer h4 { margin: 8px 0 2px; font-size: 0.88em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.drawer ul { margin: 0; padding-left: 18px; }
.drawer a { color: var(--accent-blue); text-decoration: none; margin-right: 14px; }
.clickable { cursor: pointer; }
.clickable:hover { background: var(--bg-card-hover); }
.gated { opacity: 0.5; }

/* progress + pips */
.pg { display: inline-flex; gap: 6px; align-items: center; vertical-align: middle; white-space: nowrap; }
.pgbar { width: 72px; height: 6px; background: var(--bg-input); border-radius: 3px; overflow: hidden; display: inline-block; }
.pgbar i { display: block; height: 100%; background: var(--accent-green); }
.pips { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
.pip {
  font-size: 0.78em; padding: 0 6px; border-radius: 4px; border: 1px solid var(--border-default);
  color: var(--text-muted); white-space: nowrap; line-height: 1.6;
}
.pip.on { background: var(--badge-green-bg); border-color: transparent; color: var(--accent-green); }

/* picker */
.picker { margin-top: 8px; padding: 8px 10px; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 6px; }
.pk-head { margin-bottom: 4px; }
.pk-row { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; padding: 1px 4px; border-radius: 4px; cursor: pointer; }
.pk-row:hover { background: var(--bg-card-hover); }
.pk-group { margin: 8px 0 2px; font-size: 0.8em; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.pk-cur { font-variant-numeric: tabular-nums; }

/* three beats */
.beat { margin-bottom: 18px; }
.beat h2 { font-size: 1em; margin: 0 0 6px; color: var(--text-heading); display: flex; gap: 10px; align-items: baseline; }
.beat h2 .n { color: var(--accent); }
.line { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: baseline; padding: 4px 8px; border-radius: 6px; }
.line .box { width: 16px; height: 16px; border: 1px solid var(--text-faint); border-radius: 3px; display: inline-block; transform: translateY(3px); }
.line .box.on { background: var(--accent-green); border-color: var(--accent-green); }
.line .where { color: var(--text-muted); text-align: right; }
.donebox { margin-top: 14px; }
.donebox .toggle { color: var(--text-faint); padding: 2px 8px; border-radius: 6px; display: inline-block; }
.mapbtn {
  font: inherit; font-size: 0.75em; background: var(--badge-blue-bg); color: var(--accent-blue); border: 0;
  border-radius: 4px; padding: 0 6px; margin-left: 4px; cursor: pointer; vertical-align: middle; line-height: 1.6;
}
.treebtn { font: inherit; font-size: 0.8em; background: transparent; color: var(--accent-blue); border: 1px solid var(--border-default); border-radius: 4px; padding: 0 8px; cursor: pointer; font-weight: 400; }
.next { box-shadow: inset 3px 0 0 var(--accent); background: rgba(224,178,60,0.06); }
.nexttag { color: var(--accent); font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 6px; }
.tripline { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: baseline; padding: 4px 8px; border-radius: 6px; }
.tripline .place { color: var(--text-heading); margin-right: 8px; }
.tchip { display: inline-block; padding: 0 8px; border-radius: 4px; background: var(--bg-input); margin: 2px 4px 2px 0; cursor: pointer; white-space: nowrap; font-size: 0.92em; }
.tchip:hover { background: var(--bg-card-hover); }
.tchip.sel { outline: 1px solid var(--accent); }
.tchip.isnext { outline: 1px solid var(--accent); color: var(--text-heading); }
.notes { margin-top: 28px; padding: 12px 16px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 8px; color: var(--text-muted); }
@media (max-width: 640px) {
  .line { grid-template-columns: 24px 1fr; }
  .line .where { grid-column: 2; text-align: left; }
}
</style>

const COPIES = {
  need2: { label: "Need 2", n: 2, tag: "2 copies: subsume + keep" },
  haveone: { label: "Have one built", n: 1, tag: "1 more: have one", questDone: true },
  subsumed: { label: "Already subsumed", n: 1, tag: "1 to keep: subsumed", questDone: true },
  prime: { label: "Own the Prime", n: 1, tag: "1 copy: Prime owned" },
};
const STATUSES = { nothing: "Nothing", partway: "Partway", almost: "Almost done" };
let itemKey = "badbaby", status = "nothing", copiesMode = "need2", open = null, showDone = false;
const PICKS = {};

const ETA = {};
function dropEta(list) {
  if (!list.length) return 0;
  const key = JSON.stringify(list);
  if (ETA[key] != null) return ETA[key];
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const T = 1500;
  let total = 0;
  for (let t = 0; t < T; t++) {
    const left = list.map((x) => x.n);
    let rem = left.reduce((a, b) => a + b, 0), runs = 0;
    while (rem > 0 && runs < 5000) {
      runs++;
      let r = rnd() * 100;
      for (let i = 0; i < list.length; i++) {
        if (r < list[i].pct) { if (left[i] > 0) { left[i]--; rem--; } break; }
        r -= list[i].pct;
      }
    }
    total += runs;
  }
  return (ETA[key] = Math.round(total / T));
}

function getPicks(shop) {
  const k = [shop, status, copiesMode].join("|");
  // Holds the units flipped away from the default: every non-cosmetic unit starts picked.
  return (PICKS[k] ??= new Set());
}
function pick(id) {
  const s = getPicks(ITEMS[itemKey].shop);
  if (s.has(id)) s.delete(id); else s.add(id);
  render();
}

function shopState(ctx) {
  const sh = SHOPS[ctx.item.shop], flipped = getPicks(ctx.item.shop);
  const isPicked = (w) => (w.item !== "cosmetic") !== flipped.has(w.id);
  const wares = sh.wares.flatMap((w) => {
    const cosmetic = w.item === "cosmetic";
    const qty = cosmetic ? 1 : ITEMS[w.item].copies ? COPIES[copiesMode].n : w.qty ?? 1;
    const got = cosmetic ? 0 : ctx.count(w.key), fromQuest = !cosmetic && w.quest && !ctx.count(w.quest) ? 1 : 0;
    return Array.from({ length: qty }, (_, i) => {
      const ownedText = i < got ? "owned" : i < got + fromQuest ? "quest reward" : null;
      return { ...w, id: qty > 1 ? `${w.id}-${i + 1}` : w.id, label: qty > 1 ? `${w.name} #${i + 1}` : w.name, owned: !!ownedText, ownedText };
    });
  });
  const picked = wares.filter((w) => !w.owned && isPicked(w));
  const pickedCount = {};
  for (const w of picked) if (w.key) pickedCount[w.key] = (pickedCount[w.key] ?? 0) + 1;
  const need = {};
  let any = 0;
  for (const c of sh.curs) need[c.cur] = 0;
  for (const w of picked) for (const [c, a] of Object.entries(w.price)) { if (c === "any") any += a; else need[c] += a; }
  const lines = sh.curs.map((c) => {
    const have = ctx.cur(c.cur), gap = Math.max(0, need[c.cur] - have);
    return { ...c, have, need: need[c.cur], gap, runs: c.per ? Math.ceil(gap / c.per) : 0, demos: c.demo ? Math.ceil(gap / c.demo) : 0 };
  });
  const sum = (f) => lines.reduce((a, l) => a + l[f], 0);
  let pool = null;
  if (sh.pooled) {
    // Single-currency shortfalls can't be paid with the other Talent, so the pooled gap never drops below their sum.
    const have = sum("have"), need = sum("need") + any, gap = Math.max(sum("gap"), need - have, 0);
    pool = { have, need, any, gap, runs: Math.ceil(gap / sh.pooled) };
  }
  const runs = pool ? pool.runs : sh.together ? Math.max(...lines.map((l) => l.runs)) : sum("runs");
  const covered = pool ? pool.gap === 0 : lines.every((l) => l.gap === 0);
  return { sh, wares, picked, pickedCount, isPicked, lines, pool, runs, demos: sum("demos"), covered };
}

function makeCtx(item) {
  const cm = COPIES[copiesMode];
  const target = item.copies ? cm.n : 1;
  const inv = item.inv[status] ?? {};
  const onceKeys = new Set(item.steps.filter((s) => s.once).map((s) => s.key));
  const counts = {};
  for (const k of inv.has ?? []) counts[k] = (counts[k] ?? 0) + 1;
  for (const k of FRAME_KEYS) if (counts[k]) counts[k] = Math.max(0, counts[k] - (2 - cm.n));
  const count = (k) => (cm.questDone && k.startsWith("quest:") ? 1 : counts[k] ?? 0);
  const goal = (k) => (onceKeys.has(k) || k.startsWith("quest:") ? 1 : item.qty?.[k] ?? target);
  const ctx = { item, target, count, goal, sh: SHOPS[item.shop], cur: (c) => inv.cur?.[c] ?? 0 };
  ctx.owned = (k) => count(k) >= goal(k);
  ctx.want = (k, questKey) => Math.max(0, goal(k) - count(k) - (questKey && !count(questKey) ? 1 : 0));
  const steps = item.steps.map((s, idx) => ({ ...s, idx: String(idx) }));
  const need = {};
  const add = (m, q) => { if (q > 0) need[m] = (need[m] ?? 0) + q; };
  for (const s of steps) {
    if (s.t === "build") { const left = ctx.want(s.key); for (const [m, q] of Object.entries(s.mats)) add(m, q * left); }
    if (s.t === "buy" && s.cost.cur === "Credits") add("Credits", s.cost.amt * ctx.want(s.key, s.quest));
    if (s.t === "mat" && s.fixed) add(s.what, s.fixed);
  }
  const haveMat = (m) => {
    const v = inv.mats?.[m];
    if (v === true) return Infinity;
    if (typeof v === "number") return v;
    return inv.allMats || (inv.allCommon && RES[m]?.common) ? Infinity : 0;
  };
  for (const s of steps) {
    if (s.t !== "mat" || !s.craft?.mats) continue;
    const short = Math.max(0, (need[s.what] ?? 0) - haveMat(s.what));
    const f = s.craft.per ? short / s.craft.per : (short > 0 ? 1 : 0);
    for (const [m, q] of Object.entries(s.craft.mats)) add(m, Math.ceil(q * f));
  }
  ctx.need = need;
  ctx.haveMat = haveMat;
  for (const s of steps) {
    if (s.t === "mat") {
      const r = RES[s.what] ?? {};
      for (const f of ["verb", "where", "sub", "rate", "trip", "map", "common"]) if (!(f in s)) s[f] = r[f];
      s.trip = s.trip ?? s.where;
      s.detail = s.detail ?? { other: r.other };
      s.need = need[s.what] ?? 0;
      const h = haveMat(s.what);
      s.have = Math.min(h, s.need);
      s.done = h >= s.need;
      if (!s.done && s.craft && !ctx.owned(s.craft.bp)) { s.block = true; s.gate = "buy the blueprint first"; }
    }
    if (s.t === "buy") {
      s.qty = ctx.want(s.key, s.quest);
      s.done = s.qty === 0;
      s.costAll = s.cost.amt * s.qty;
      if (!s.done && s.cost.cur !== "Credits") {
        const b = ctx.cur(s.cost.cur);
        if (b < s.cost.amt) { s.block = true; s.gate = `need ${fmt(s.cost.amt - b)} more`; }
      }
    }
    if (s.t === "quest") s.done = count(s.key) > 0;
    if (s.t === "drop") {
      s.lacking = s.parts.filter((p) => ctx.want(p.key) > 0);
      s.done = s.lacking.length === 0;
      s.eta = dropEta(s.lacking.map((p) => ({ pct: p.pct, n: ctx.want(p.key) })));
    }
  }
  for (const s of steps) {
    if (s.t === "earn") {
      s.need = steps.filter((b) => b.t === "buy" && b.cost.cur === s.cur).reduce((a, b) => a + b.costAll, 0);
      const bal = ctx.cur(s.cur);
      s.have = Math.min(bal, s.need);
      s.done = bal >= s.need;
    }
    if (s.t === "build") {
      s.qty = ctx.want(s.key);
      s.done = s.qty === 0;
      if (!s.done) {
        if (s.needs.some((k) => k.startsWith("bp:") && !count(k))) s.gate = "needs blueprint";
        else if (s.needs.some((k) => k.startsWith("built:") && !count(k))) s.gate = "needs parts";
        else if (Object.keys(s.mats).some((m) => haveMat(m) < (need[m] ?? 0))) s.gate = "needs mats";
        s.block = !!s.gate;
      }
    }
  }
  if (item.shop) {
    const st = (ctx.shop = shopState(ctx));
    for (const s of steps) {
      if (s.t === "grind") {
        s.lacking = s.parts.filter((p) => ctx.want(p.key, p.quest) > 0);
        const unpicked = s.lacking.map((p) => ({ pct: p.pct, n: ctx.want(p.key, p.quest) - (st.pickedCount[p.key] ?? 0) })).filter((p) => p.n > 0);
        s.done = s.lacking.length === 0 || (st.covered && unpicked.length === 0);
        s.dropEta = dropEta(s.lacking.map((p) => ({ pct: p.pct, n: ctx.want(p.key, p.quest) })));
        s.runs = Math.max(st.runs, dropEta(unpicked));
      }
      if (s.t === "shopbuy") {
        s.done = st.picked.length === 0;
        s.block = !s.done && !st.covered;
      }
    }
  }
  ctx.steps = steps;
  ctx.rows = rowsOf(steps);
  const todo = ctx.rows.filter((r) => !r.done);
  ctx.next = todo.find((r) => !r.block) ?? todo[0] ?? null;
  return ctx;
}

// Real lines plus one virtual Basics line, placed just before the first build.
function rowsOf(steps) {
  const commons = steps.filter((s) => s.t === "mat" && s.common);
  const rows = steps.filter((s) => !(s.t === "mat" && s.common));
  if (!commons.length) return rows;
  const left = commons.filter((s) => !s.done);
  const basics = { t: "basics", idx: "basics", beat: "farm", trip: "Basics", verb: "Top up", what: "basics", list: commons, left, done: left.length === 0 };
  const at = rows.findIndex((s) => s.t === "build");
  rows.splice(at < 0 ? rows.length : at, 0, basics);
  return rows;
}
function bar(have, need, showQty = true) {
  const pct = need ? Math.min(100, (have / need) * 100) : 100;
  return `<span class="pg"><span class="pgbar"><i style="width:${pct}%"></i></span>${showQty
    ? `<span class="qty">${have > 0 ? fmt(have) + " / " : ""}${fmt(need)}</span>` : ""}</span>`;
}
const mapBtn = (s) => (s.map ? `<button class="mapbtn" title="${MAPS[s.map]} map" onclick="event.stopPropagation()">Map</button>` : "");
const curShort = (c) => (c === "Credits" ? "cr" : c.endsWith("Standing") ? "Standing" : c);
const times = (n) => (n > 1 ? ` <span class="qty">×${n}</span>` : "");
const chips = (s) => (s.hot ? `<span class="chip warn">${s.hot}</span>` : "") + (s.gate ? `<span class="chip gate">${s.gate}</span>` : "");
const allDone = () => `<div class="muted">All done.</div>`;

function pips(parts, ctx) {
  return `<span class="pips">${parts.map((p) => {
    const want = ctx.want(p.key, p.quest), got = ctx.count(p.key);
    if (ctx.owned(p.key)) return `<span class="pip on">${p.name}</span>`;
    if (!want) return `<span class="pip">${p.name} from quest</span>`;
    const g = ctx.goal(p.key);
    const prog = g > 1 && got > 0 ? ` ${got}/${g}` : "";
    return `<span class="pip">${p.name}${prog} ${p.tag ?? p.pct + "%"}</span>`;
  }).join("")}</span>`;
}

function matText(s, verb = true) {
  const v = verb ? s.verb + " " : "";
  if (s.have > 0) return `${v}${s.what} ${bar(s.have, s.need)}`;
  return `${v}<span class="qty">${fmt(s.need)}</span> ${s.what}${s.need >= 1000 ? " " + bar(0, s.need, false) : ""}`;
}

function balance(ctx) {
  const p = ctx.shop.pool;
  if (p) return `${ctx.sh.unit} ${p.need ? bar(p.need - p.gap, p.need) : `<span class="qty">${fmt(p.have)}</span>`}`;
  return ctx.shop.lines.map((l) => `${l.short} ${l.need ? bar(l.have, l.need) : `<span class="qty">${fmt(l.have)}</span>`}`).join(" ");
}
function pickedCost(ctx) {
  const p = ctx.shop.pool;
  return [...ctx.shop.lines.filter((l) => l.need).map((l) => `${fmt(l.need)} ${l.short}`),
    p?.any ? `${fmt(p.any)} either` : ""].filter(Boolean).join(" + ");
}

function title(s, ctx) {
  const sh = ctx.sh;
  switch (s.t) {
    case "mat": return matText(s) + mapBtn(s);
    case "earn": return `Earn ${s.what} ${bar(s.have, s.need)}${mapBtn(s)}`;
    case "buy": return `Buy ${s.what}${times(s.qty)}${s.tag ? ` <span class="faint">${s.tag}</span>` : ""}`;
    case "quest": return `Finish ${s.what}`;
    case "drop": return `${s.verb} ${s.what}${s.noEta ? "" : ` <span class="chip">~${s.eta} ${s.runWord ?? "runs"}</span>`}${mapBtn(s)} ${pips(s.parts, ctx)}`;
    case "grind": {
      const runChip = s.runs ? `<span class="chip ${s.runs > 15 ? "warn" : ""}">~${s.runs} ${sh.runWord}</span>` : "";
      const demoChip = ctx.shop.demos ? `<span class="chip">about ${fmt(ctx.shop.demos)} Demolishers</span>` : "";
      return `Run ${s.what} ${runChip}${demoChip} ${pips(s.parts, ctx)}`;
    }
    case "shopbuy": {
      const n = ctx.shop.picked.length;
      return s.block ? `Buy when ${sh.unit} ${/s$/.test(sh.unit) ? "cover" : "covers"} your picks` : `Buy ${n} pick${n === 1 ? "" : "s"} at ${sh.vendor}`;
    }
    case "build": return `${s.verb} ${s.label ?? s.what}${times(s.qty)}`;
    case "basics": return `Basics ${s.left.map((m) => `<span class="chip">${matText(m, false)}</span>`).join("")}`;
  }
  return s.what;
}
function doneTitle(s, ctx) {
  if (s.t === "basics") return "Basics";
  if (s.t === "shopbuy") return `Buy at ${ctx.sh.vendor}`;
  if (s.t === "grind") return `Run ${s.what}`;
  return `${s.verb ?? ""} ${s.label ?? s.what}`;
}
function meta(s, ctx) {
  switch (s.t) {
    case "buy": return `${s.where} · ${fmt(s.cost.amt)} ${curShort(s.cost.cur)}${s.qty > 1 ? " each" : ""}`;
    case "grind": return balance(ctx);
    case "shopbuy": return `${s.where} · ${pickedCost(ctx)}`;
    case "build": return s.time ?? s.where ?? "";
    case "basics": return `${s.left.length} common`;
  }
  return s.where ?? "";
}

function picker(ctx) {

        ? `, at least ${st.lines.filter((l) => l.gap).map((l) => `${fmt(l.gap)} ${l.short}`).join(" and ")}` : ""}` : `${sh.unit}${covered}`}</div>`

  return `<div class="picker"><div class="pk-head"><b>${sh.vendor}</b> <span class="muted">${sh.where}</span>
    ${also.length ? `<span class="chip">Also: ${also.join(", ")}</span>` : ""} <span class="faint">${sh.perText}</span>${lines}</div>
    ${[...groups].map(([g, list]) => `<div class="pk-group">${g}</div>${list.map(row).join("")}`).join("")}</div>`;
}

const wikiName = (s, ctx) => (["mat", "earn", "quest"].includes(s.t) ? s.what : ctx.item.name);
function drawer(s, ctx) {
  if (s.t === "basics") {
    return `<div class="drawer">${s.list.map((m) => `<div>${m.done ? `<span class="done">${m.what}</span>` : matText(m, false)}
      <span class="muted">· ${m.where}, ${m.sub}</span> <a href="${WIKI(m.what)}" target="_blank">Wiki</a></div>`).join("")}</div>`;
  }
  const d = s.detail ?? {};
  const facts = [s.sub, s.rate, s.t === "buy" ? `${fmt(s.cost.amt)} ${curShort(s.cost.cur)}` : null, s.time].filter(Boolean);
  let extra = "";
  if (s.t === "build") {
    extra = `<h4>Needs</h4>${Object.entries(s.mats).map(([m, q]) =>
      `<span class="chip ${ctx.haveMat(m) >= (ctx.need[m] ?? 0) ? "ok" : ""}">${fmt(q * Math.max(1, s.qty))} ${m}</span>`).join("") || '<span class="muted">the four parts</span>'}`;
  }
  if (s.t === "grind" && s.lacking.length) extra = `<h4>Drops alone</h4><div>~${s.dropEta} ${ctx.sh.runWord} for what's left</div>`;
  if (s.t === "grind" || s.t === "shopbuy") extra += `<h4>Shop</h4>${picker(ctx)}`;
  return `<div class="drawer">
    ${s.where ? `<div><b>${s.where}</b> ${facts.map((f) => `<span class="chip">${f}</span>`).join("")}${mapBtn(s)}</div>` : ""}
    ${d.notes ? `<h4>Notes</h4><ul>${d.notes.map((n) => `<li>${n}</li>`).join("")}</ul>` : ""}
    ${d.other?.length ? `<h4>Other spots</h4><ul>${d.other.map((n) => `<li>${n}</li>`).join("")}</ul>` : ""}
    ${extra}
    <div style="margin-top:6px"><a href="${WIKI(wikiName(s, ctx))}" target="_blank">Wiki</a></div></div>`;
}
const BEATS = [["buy", "Get blueprints"], ["farm", "Farm"], ["build", "Build"]];

function lineA(s, ctx) {
  const isNext = ctx.next === s;
  return `<div class="line clickable ${s.block && !s.done ? "gated" : ""} ${isNext ? "next" : ""}" onclick="toggle('${s.idx}')">
    <span class="box ${s.done ? "on" : ""}"></span>
    <span class="${s.done ? "done" : ""}">${isNext ? '<span class="nexttag">Next</span>' : ""}${s.done ? doneTitle(s, ctx) : title(s, ctx) + " " + chips(s)}</span>
    <span class="where">${s.done ? "" : meta(s, ctx)}</span></div>${open === s.idx ? drawer(s, ctx) : ""}`;
}

function beats(ctx, farmBody) {
  let n = 0;
  return BEATS.map(([beat, name]) => {
    const rows = ctx.rows.filter((r) => r.beat === beat && !r.done);
    if (!rows.length) return "";
    const body = beat === "farm" && farmBody ? farmBody(rows) : rows.map((r) => lineA(r, ctx)).join("");
    return `<div class="beat"><h2><span class="n">${++n}</span>${name}</h2>${body}</div>`;
  }).join("") || allDone();
}

function renderD(ctx) {
  return beats(ctx, (rows) => {
    const groups = new Map();
    for (const r of rows) {
      const k = r.t === "basics" ? "~basics" : r.trip ?? r.where ?? r.idx;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    return [...groups.values()].map((g) => (g.length === 1 ? lineA(g[0], ctx) : tripLine(g, ctx))).join("");
  });
}
function tripLine(g, ctx) {
  const hasNext = g.includes(ctx.next);
  const sel = g.find((s) => s.idx === open);
  const chip = (s) => `<span class="tchip ${s.idx === open ? "sel" : ""} ${s === ctx.next ? "isnext" : ""} ${s.block ? "gated" : ""}"
    onclick="toggle('${s.idx}')">${s.t === "mat" ? matText(s) + mapBtn(s) : title(s, ctx)}</span>`;
  return `<div class="tripline ${hasNext ? "next" : ""}"><span class="box" style="width:16px;height:16px;border:1px solid var(--text-faint);border-radius:3px;display:inline-block;transform:translateY(3px)"></span>
    <span>${hasNext ? '<span class="nexttag">Next</span>' : ""}<span class="place">${g[0].trip ?? g[0].where}</span>${g.map(chip).join("")}</span></div>
    ${sel ? drawer(sel, ctx) : ""}`;
}

function doneBox(ctx) {
  const list = ctx.rows.filter((r) => r.done);
  if (!list.length) return "";
  return `<div class="donebox"><span class="toggle clickable" onclick="showDone=!showDone;render()">${showDone ? "▾" : "▸"} ${list.length} done</span>
    ${showDone ? list.map((s) => lineA(s, ctx)).join("") : ""}</div>`;
}

function head(ctx) {
  const it = ctx.item;
  const copyTag = it.copies ? `<span class="chip ${copiesMode === "need2" ? "" : "ok"}">${COPIES[copiesMode].tag}</span>` : "";
  return `<div class="head"><div class="art">${it.name}</div><div>
    <h1>${it.name}<span class="chip eff">${EFFORT[it.effort]}</span></h1>
    <div>${copyTag}<span class="links"><a href="${WIKI(it.name)}" target="_blank">Wiki</a>${it.tradeable ? `<a href="${WFM(it.name)}" target="_blank">warframe.market</a>` : ""}<button class="treebtn">Crafting tree</button></span></div>
  </div></div>`;
}

const NOTES = "Status sets what the player already has. Done lines vanish into the N done disclosure. Copies applies to Warframes only.";

function set(k, v) {
  if (k === "item") {
    itemKey = v; showDone = false;
    if (ITEMS[v].noPrime && copiesMode === "prime") copiesMode = "need2";
  }
  if (k === "status") { status = v; showDone = false; }
  if (k === "copies") { copiesMode = v; showDone = false; }
  open = null;
  render();
}
function toggle(id) { open = open === id ? null : id; render(); }

function render() {
  const item = ITEMS[itemKey];
  const btns = (label, key, entries, cur) => `<span class="label">${label}</span>` + entries.map(([k, v]) =>
    `<button class="tab" aria-pressed="${k === cur}" onclick="set('${key}','${k}')">${v}</button>`).join("");
  const copies = Object.entries(COPIES).filter(([k]) => !(k === "prime" && item.noPrime)).map(([k, c]) => [k, c.label]);
  document.getElementById("items").innerHTML = btns("Item", "item", Object.entries(ITEMS).map(([k, it]) => [k, it.name]), itemKey);
  document.getElementById("statuses").innerHTML = btns("Status", "status", Object.entries(STATUSES), status)
    + (item.copies ? `<span style="width:16px"></span>` + btns("Copies", "copies", copies, copiesMode) : "");
  const ctx = makeCtx(item);
  document.getElementById("view").innerHTML = head(ctx) + renderD(ctx) + doneBox(ctx);
  document.getElementById("notes").textContent = NOTES;
}
render();
</script>
</body>
</html>
